name: PR QA Copilot (self-demo)

on:
  pull_request:
    types: [opened, synchronize, reopened]

  # Allows running the demo without opening a PR (useful for pilots).
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test (e.g. Vercel preview URL)"
        required: true
        default: "https://example.com"
      paths:
        description: "Newline-separated paths"
        required: false
        default: "/"

permissions:
  contents: read
  deployments: read
  pull-requests: write
  actions: write # required for artifact upload

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pull requests exercise automatic preview discovery. Manual runs use the supplied URL.
      - uses: ./. 
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_url: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_url || '' }}
          paths: |
            ${{ github.event.inputs.paths || '/' }}
          # Exercise the journey runner on PRs against the stable example.com target.
          journey_file: ${{ github.event_name == 'pull_request' && '.github/pr-qa-copilot-self-demo.json' || '' }}
